name: Deploy Vue CLI to GitHub Pages

on:
  push:
    branches: ["main"]   # 如果你的默认分支是 master，请改为 master
  workflow_dispatch:

# 设置部署权限
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci   # 如果报错，可改成 npm install

      - name: Build Vue CLI project
        run: npm run build   # Vue CLI 默认输出到 dist 文件夹

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist   # 关键：Vue CLI 构建产物在这里

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
