name: Deploy Vue to GitHub Pages

on:
  push:
    branches: ["main"]   # 如果你的默认分支是 master，请改为 master
  workflow_dispatch:     # 允许手动触发

# 设置 GITHUB_TOKEN 的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 避免同时部署冲突
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'   # 利用缓存加速安装

      - name: Install dependencies
        run: npm ci      # 推荐用 ci，比 npm install 更快更稳定

      - name: Build Vue project
        run: npm run build  # 默认生成 dist 文件夹

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist      # 上传构建产物

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
